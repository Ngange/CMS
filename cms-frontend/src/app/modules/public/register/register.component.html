<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Register</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <!-- Full Name -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full Name</mat-label>
          <input
            matInput
            formControlName="fullName"
            placeholder="Enter your full name"
          />
          <mat-error *ngIf="registerForm.get('fullName')?.hasError('required')"
            >Full name is required</mat-error
          >
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Enter your email"
          />
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')"
            >Email is required</mat-error
          >
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')"
            >Invalid email format</mat-error
          >
        </mat-form-field>

        <!-- Password -->
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            placeholder="Enter your password"
          />
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')"
            >Password is required</mat-error
          >
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')"
            >Password must be at least 6 characters</mat-error
          >
        </mat-form-field>

        <!-- Error Message -->
        <mat-error *ngIf="errorMessage" class="error-message">{{
          errorMessage
        }}</mat-error>

        <!-- Submit Button -->
        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="!registerForm.valid || isLoading || isLoadingRoles"
        >
          <span *ngIf="!isLoading && !isLoadingRoles">Register</span>
          <span *ngIf="isLoadingRoles">Loading...</span>
          <mat-spinner
            *ngIf="isLoading && !isLoadingRoles"
            diameter="20"
          ></mat-spinner>
        </button>

        <!-- Login Link -->
        <p class="text-center">
          Already have an account? <a routerLink="/login">Login here</a>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
</div>
